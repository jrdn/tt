name: tag

# Every push to main gets the next release tag if the commits since the last one
# warrant it: feat: bumps the minor, fix: the patch, a breaking change the major,
# docs/chore/ci/style/test/build alone ship nothing. See
# .github/scripts/next_version.py for the rules and AGENTS.md for the commit
# convention. The tag is what publishes the image, so this replaces tagging by
# hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the tag
  actions: write # start the image build on it

# Two merges in quick succession must not compute the same version twice.
concurrency:
  group: tag
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the version comes from what is already released.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Work out the next version
        id: next
        run: python3 .github/scripts/next_version.py --explain
      - name: Nothing to release
        if: steps.next.outputs.version == ''
        run: echo "No release-worthy commits since the last tag; not tagging."
      - name: Tag
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$VERSION"; then
            echo "$VERSION is already tagged; nothing to do."
            exit 0
          fi
          git tag -a "$VERSION" -m "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
      # A tag pushed with GITHUB_TOKEN does not trigger image.yml, so ask for the
      # build on the tag by hand. metadata-action reads the tag ref and publishes
      # ghcr.io/jrdn/tt:$VERSION (no leading v) alongside the sha tag.
      - name: Publish the image
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
        run: gh workflow run image.yml --ref "$VERSION"
